<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | The Pipelayer's Bible</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111318">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--ink:#111318;--yellow:#F4C542;--canvas:#EEF0F3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--ink);color:var(--canvas);font:17px/1.55 Arial,Helvetica,sans-serif}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
img{width:88px;height:88px;border-radius:22px;margin:0 auto 20px;display:block}
h1{font:700 clamp(30px,8vw,44px)/1.1 "Oswald","Arial Narrow",Arial,sans-serif;text-transform:uppercase;margin:0 0 12px}
p{margin:0 0 24px;color:#B8BCC6}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:12px;font-weight:700;text-decoration:none;border:2px solid var(--yellow)}
.p{background:var(--yellow);color:var(--ink)}.g{color:var(--canvas);border-color:#5A606C!important}
a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
</style>
</head>
<body>
<main>
  <div>
    <img src="/img/logo-192.png" width="88" height="88" alt="The Pipelayer's Bible logo">
    <h1>Off grade</h1>
    <p>That page isn't here. It may have moved.</p>
    <div class="btns">
      <a class="btn p" href="/">Go to the home page</a>
      <a class="btn g" href="https://app.pipelayersbible.com">Open the app</a>
    </div>
  </div>
</main>
<div class="stripe" aria-hidden="true"></div>
<script data-goatcounter="https://pipelayersbible.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
